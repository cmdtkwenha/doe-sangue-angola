<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sem ligação | Doe Sangue Angola</title>
    <style>
      body {
        align-items: center;
        background: #f6f4f1;
        color: #252525;
        display: grid;
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #fff;
        border: 1px solid #ece6dc;
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(20, 20, 20, 0.12);
        margin: auto;
        max-width: 440px;
        padding: 28px;
      }
      h1 { color: #b10f1f; margin: 0 0 10px; }
      p { color: #6f737b; line-height: 1.55; }
      button {
        background: #b10f1f;
        border: 0;
        border-radius: 12px;
        color: #fff;
        font-weight: 800;
        min-height: 44px;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Está sem ligação</h1>
      <p>Não foi possível abrir esta área agora. Verifique a internet e tente novamente. Os dados serão sincronizados quando a ligação voltar.</p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
